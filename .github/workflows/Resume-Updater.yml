
name: Update Naukri Resume

on:
  schedule:
    # 9:00 AM IST = 3:30 AM UTC
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naukri-resume-update
  cancel-in-progress: false

jobs:
  update-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Print IST current time
        run: |
          echo "Current IST time: $(TZ='Asia/Kolkata' date)"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Run resume updater
        env:
          NAUKRI_COOKIES: ${{ secrets.NAUKRI_COOKIES }}
          GOOGLE_DRIVE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_FILE_ID }}
          NAUKRI_FORM_KEY: ${{ secrets.NAUKRI_FORM_KEY }}
        run: python updateDaily.py